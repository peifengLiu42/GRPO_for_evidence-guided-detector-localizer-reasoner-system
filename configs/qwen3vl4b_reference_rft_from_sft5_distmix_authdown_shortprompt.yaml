### model
model_name_or_path: /path/to/Qwen3-VL-4B-Instruct
adapter_name_or_path: outputs/qwen3vl4b_reference_sft_from_scratch_distmix_authdown_shortprompt_visionlora_projector/checkpoint-1230
image_max_pixels: 1048576
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target: all
additional_target: visual.merger

### dataset
dataset: realtext_reference_rft_from_sft5_distmix_authdown_shortprompt
dataset_dir: data
template: qwen3_vl
cutoff_len: 10000
max_samples: 4096
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: outputs/qwen3vl4b_reference_rft_from_sft5_distmix_authdown_shortprompt_visionlora_projector
logging_steps: 5
save_strategy: steps
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
ddp_timeout: 180000000
ddp_find_unused_parameters: false
resume_from_checkpoint: null

### eval
# Keep realtext_indomain external; do not mix test.txt samples into RFT.
